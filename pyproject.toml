[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-translator-local"
version = "0.2.0"
description = "Offline phrase-level speech translation for Windows meetings"
requires-python = ">=3.11"
dependencies = [
    "av>=11,<19",
    "ctranslate2>=4,<5",
    "faster-whisper>=1.0,<2",
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "sentencepiece>=0.2,<1",
    "sounddevice>=0.4,<1",
]

[project.optional-dependencies]
translate = ["argostranslate>=1.9,<2"]
tts = ["pyttsx3>=2.90,<3"]
build = ["pyinstaller>=6,<7"]
all = [
    "argostranslate>=1.9,<2",
    "pyttsx3>=2.90,<3",
    "pyinstaller>=6,<7",
]

# The optional Parakeet ASR engine lives in packages/parakeet-live and is not
# published yet, so it cannot be declared as an extra here. Install it from the
# checkout: python -m pip install -e .\packages\parakeet-live

[project.scripts]
live-translator = "live_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
