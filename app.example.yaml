audio:
  sample_rate: 16000
  chunk_seconds: 4.0
  input_device: auto
  output_device: auto
  peer_input_device: auto
  input_gain: 1.0
  playback_gain: 0.7

asr:
  engine: parakeet
  model: nemo-parakeet-tdt-0.6b-v3
  device: cpu
  compute_type: int8
  cpu_threads: 8
  source_language: en
  # Tune per direction profile, not globally -- measured on open proxy data,
  # confidence/WER correlation differs by source_language (and by audio
  # condition). -1.3 is inherited from Whisper's scale and effectively never
  # fires on this model; see scripts/calibrate_log_prob_threshold.py.
  log_prob_threshold: -1.3
  # Opt-in: marks an accepted segment "[low confidence]" in the printed
  # output instead of rejecting it, so possibly-correct content still
  # reaches translation. Must be greater than log_prob_threshold. Unset (the
  # default) disables flagging entirely. Not enabled here yet -- pending
  # calibration against real meeting audio, not just the open proxy data in
  # scripts/calibrate_log_prob_threshold.py.
  # flag_log_prob_threshold: -0.05
  compression_ratio_threshold: 2.4
  min_segment_chars: 2

translation:
  engine: argos
  source_language: en
  target_language: de

tts:
  engine: piper
  model_path: models/tts/de_DE-thorsten-medium.onnx
  piper_exe: tools/piper/piper.exe
  speaker: null
  length_scale: 1.0

chunking:
  mode: vad
  frame_ms: 30
  min_speech_ms: 180
  min_segment_seconds: 0.8
  rolling_window_seconds: 2.4
  silence_ms: 450
  max_seconds: 5.0
  pre_roll_ms: 200
  rms_threshold: 0.008
  peak_threshold: 0.025
  min_active_ratio: 0.06
  noise_multiplier: 3.0

realtime:
  recognition_queue_size: 2
  playback_queue_size: 1
