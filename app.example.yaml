audio:
  sample_rate: 16000
  chunk_seconds: 4.0
  input_device: auto
  output_device: auto
  peer_input_device: auto
  input_gain: 1.0
  playback_gain: 0.7

asr:
  engine: parakeet
  model: nemo-parakeet-tdt-0.6b-v3
  # Where `prepare-models` put the model. Unset uses models/asr/<model> in the
  # checkout, or %LOCALAPPDATA%/LiveTranslator/models/asr/<model> for an
  # installed build. Meeting mode reads this directory and never downloads, so
  # a missing or incomplete one is a startup error, not a fetch.
  # model_dir: null
  device: cpu
  compute_type: int8
  cpu_threads: 8
  source_language: en
  # Tune per direction profile, not globally -- measured on open proxy data,
  # confidence/WER correlation differs by source_language (and by audio
  # condition). -1.3 is inherited from Whisper's scale and effectively never
  # fires on this model; see scripts/calibrate_log_prob_threshold.py.
  log_prob_threshold: -1.3
  # Opt-in: marks an accepted segment "[low confidence]" in the printed
  # output instead of rejecting it, so possibly-correct content still
  # reaches translation. Must be greater than log_prob_threshold. Unset (the
  # default) disables flagging entirely. Not enabled here yet -- pending
  # calibration against real meeting audio, not just the open proxy data in
  # scripts/calibrate_log_prob_threshold.py.
  # flag_log_prob_threshold: -0.05
  compression_ratio_threshold: 2.4
  min_segment_chars: 2

translation:
  engine: argos
  source_language: en
  target_language: de

tts:
  engine: piper
  model_path: models/tts/de_DE-thorsten-medium.onnx
  piper_exe: tools/piper/piper.exe
  speaker: null
  length_scale: 1.0
  piper_timeout_seconds: 30.0

chunking:
  mode: vad
  frame_ms: 30
  min_speech_ms: 180
  min_segment_seconds: 0.8
  rolling_window_seconds: 2.4
  silence_ms: 450
  max_seconds: 5.0
  pre_roll_ms: 200
  rms_threshold: 0.008
  peak_threshold: 0.025
  min_active_ratio: 0.06
  noise_multiplier: 3.0

realtime:
  recognition_queue_size: 2
  playback_queue_size: 1

# Captured meeting content, for troubleshooting only. Off unless you turn it
# on, here or with --diagnostics, because what it writes is the audio of each
# phrase and a plain-text file holding its transcript and its translation.
diagnostics:
  enabled: false
  # Setting a path here does not switch capture on; `enabled` above or
  # --diagnostics does. Each session gets its own subdirectory under it, so
  # two meetings cannot overwrite each other's phrases.
  # Empty means %LOCALAPPDATA%\LiveTranslator\diagnostics, resolved at runtime
  # so a redirected profile still works. A relative path is placed under that
  # directory rather than the working directory, which keeps captured meetings
  # out of a source checkout. An absolute path is used as given.
  dir: null
  # Retention. 0 disables that limit; the retention numbers are provisional
  # pending a stakeholder decision, not a policy.
  retention_days: 7
  max_total_mb: 500
