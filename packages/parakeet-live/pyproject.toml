[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-live"
version = "0.1.0"
description = "NVIDIA Parakeet TDT speech recognition on onnxruntime, with confidence filtering for live pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edvinas Ryliškis" }]
keywords = ["asr", "speech-recognition", "parakeet", "onnx", "onnxruntime", "nvidia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "onnx-asr>=0.12,<1",
    "onnxruntime>=1.20,<2",
]

[project.urls]
Homepage = "https://github.com/edva-code/parakeet-live"
Source = "https://github.com/edva-code/parakeet-live"
Issues = "https://github.com/edva-code/parakeet-live/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parakeet_live = ["py.typed"]
