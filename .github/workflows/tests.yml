name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Linux is here to catch anything that
        # only works because of a Windows-specific path or API.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # sounddevice imports PortAudio lazily, so the suite does not need it.
      # Installing it anyway keeps an accidental module-level import from
      # turning into a confusing Linux-only failure.
      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # No model is downloaded: the recognizer suite injects a fake model, so
      # this runs offline in about a second.
      - name: Test
        run: python -m unittest discover -s tests -t tests -v

      - name: Compile
        run: python -m compileall -q src tests
