name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Linux is here to catch anything that
        # only works because of a Windows-specific path or API.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # No PortAudio install: every sounddevice import in the package sits
      # inside a function, so nothing loads the library at import time.
      # LazyAudioImportTests enforces that on every platform, which is cheaper
      # and more direct than an apt-get that only guards the Linux legs.
      - name: Install
        run: uv sync --frozen --no-default-groups

      # No model is downloaded: the recognizer suite injects a fake model, so
      # this runs offline in about a second.
      - name: Test
        run: uv run --frozen --no-default-groups python -m unittest discover -s tests -t tests -v

      - name: Compile
        run: uv run --frozen --no-default-groups python -m compileall -q src tests

  dependency-security:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock and workflow pins
        run: |
          uv lock --check
          uv run --frozen --group security python scripts/validate_action_pins.py

      - name: Export locked dependencies
        run: >-
          uv export --frozen --all-extras --group security --no-dev --no-emit-project
          --output-file dependency-audit-requirements.txt

      - name: Audit dependencies
        run: >-
          uv run --frozen --group security python scripts/audit_dependencies.py
          --requirements dependency-audit-requirements.txt
          --policy security/vulnerability-policy.json

      - name: Verify Argos compatibility with the secured Stanza override
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        run: >-
          uv run --frozen --extra translate --no-default-groups python -c
          "from argostranslate import package; assert package is not None"

      - name: Generate and validate SBOM
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project --format cyclonedx1.5 --output-file live-translator.cdx.json
          uv run --frozen --no-default-groups python scripts/validate_sbom.py live-translator.cdx.json

      - name: Upload SBOM
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-translator-sbom
          path: live-translator.cdx.json
          if-no-files-found: error
